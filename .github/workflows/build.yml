name: Build assignment pages

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "inputs/**"
      - "questions.json"
      - "packages.json"
      - "templates/**"
      - "build.py"
      - "javapkg.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow and font
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core

      - name: Build pages
        run: python build.py

      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs outputs build_cache.json
          git diff --cached --quiet || git commit -m "Update generated pages"
          git pull --rebase
          git push
